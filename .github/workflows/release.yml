# Fork-Release: baut die Erweiterung, laesst sie von Mozilla als "unlisted"
# (Self-Distribution, keine oeffentliche AMO-Seite) signieren und haengt die
# signierte .xpi plus Quellcode an ein GitHub-Release.
#
# Benoetigte Repository-Secrets (Settings -> Secrets and variables -> Actions):
#   AMO_API_KEY     JWT issuer von https://addons.mozilla.org/developers/addon/api/key/
#   AMO_API_SECRET  JWT secret von derselben Seite
#
# Ausloesen: Version in manifest.json erhoehen, committen, dann
#   git tag v<version> && git push origin v<version>

on:
  push:
    tags:
      - 'v*'

name: Release (Firefox, unlisted)

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm ci

      - name: Lint and type check
        run: npm run lint && npm run check-types

      - name: Check tag matches manifest version
        run: |
          MANIFEST_VERSION=$(jq -r .version manifest.json)
          if [ "v${MANIFEST_VERSION}" != "${GITHUB_REF_NAME}" ]; then
            echo "Tag ${GITHUB_REF_NAME} passt nicht zu manifest.json (${MANIFEST_VERSION})"
            exit 1
          fi

      - name: Build extension
        run: ./dist.sh

      - name: Package source code for Mozilla review
        run: git archive --format=zip -o dist/source.zip HEAD

      - name: Sign with Mozilla (unlisted)
        env:
          WEB_EXT_API_KEY: ${{ secrets.AMO_API_KEY }}
          WEB_EXT_API_SECRET: ${{ secrets.AMO_API_SECRET }}
        run: |
          npx --yes web-ext@8 sign \
            --channel=unlisted \
            --source-dir=dist/bibbot \
            --artifacts-dir=dist/signed \
            --upload-source-code=dist/source.zip \
            --approval-timeout=900000
          mv dist/signed/*.xpi "dist/bibbot-wiso-${GITHUB_REF_NAME}.xpi"

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mv dist/source.zip "dist/bibbot-wiso-${GITHUB_REF_NAME}-source.zip"
          gh release create "${GITHUB_REF_NAME}" \
            "dist/bibbot-wiso-${GITHUB_REF_NAME}.xpi" \
            "dist/bibbot-wiso-${GITHUB_REF_NAME}-source.zip" \
            --title "BibBot (WISO-IP) ${GITHUB_REF_NAME}" \
            --notes "Signierte Firefox-Erweiterung. Installation: .xpi-Datei in Firefox öffnen (oder per Drag & Drop ins Firefox-Fenster ziehen). Siehe README."
